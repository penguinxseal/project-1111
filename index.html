<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030711" />
  <meta name="description" content="An independent fansite created with love for OomBam. — Something beautiful is blooming." />
  <title>OomBam Independent Fansite — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Italianno&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="teaser.css?v=20260928-1111-4" />

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png"/>
<link rel="shortcut icon" href="assets/favicon/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png"/>
</head>
<body>
  <main class="teaser" id="teaser">
    <!-- Ambient background already used by the teaser page -->
    <div class="opening-bg" aria-hidden="true"></div>

    <!-- Continuous live ambience: visible before AND after hero reveal -->
    <div class="ambient-motion" aria-hidden="true">
      <div class="water-field">
        <span class="droplet d1"></span><span class="droplet d2"></span><span class="droplet d3"></span>
        <span class="droplet d4"></span><span class="droplet d5"></span><span class="droplet d6"></span>
        <span class="droplet d7"></span><span class="droplet d8"></span><span class="droplet d9"></span>
      </div>

      <div class="clover-field">
        <span class="clover c1">☘</span><span class="clover c2">☘</span><span class="clover c3">☘</span>
        <span class="clover c4">☘</span><span class="clover c5">☘</span>
      </div>

      <div class="sakura-field">
        <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span>
        <span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span><span class="petal p9"></span>
      </div>
    </div>

    <!-- Hero artwork: pure crossfade; no blur, scale, brightness shift, or parallax -->
    <div class="hero-reveal" aria-hidden="true">
      <div class="hero-image"></div>
      <div class="center-bloom"></div>
    </div>

    <!-- Live HTML typography -->
    <header class="top-brand sequence sequence-brand" aria-label="Penguin and Seal">
      <span>PENGUIN</span><span class="heart">♥</span><span>SEAL</span>
    </header>

    <section class="hero-copy" aria-labelledby="teaser-title">
      <p class="eyebrow sequence sequence-eyebrow">An independent fansite created with love for OomBam.</p>
      <h1 id="teaser-title" class="hero-title">
        <span class="headline-main sequence sequence-headline">Something beautiful</span>
        <span class="headline-bloom sequence sequence-bloom">is blooming.</span>
      </h1>
      <p class="identity sequence sequence-identity">
        <span>OOM</span><span class="pair-x">×</span><span>BAM</span>
      </p>
      <div class="launch-block sequence sequence-coming" aria-label="Launch countdown">
        <div class="countdown" id="countdown" role="timer" aria-live="off">
          <div class="count-unit"><strong id="days">00</strong><span>DAYS</span></div>
          <span class="count-sep">:</span>
          <div class="count-unit"><strong id="hours">00</strong><span>HRS</span></div>
          <span class="count-sep">:</span>
          <div class="count-unit"><strong id="minutes">00</strong><span>MIN</span></div>
          <span class="count-sep">:</span>
          <div class="count-unit"><strong id="seconds">00</strong><span>SEC</span></div>
        </div>
        <p class="launch-date">11 · 11 · 26</p>
        <p class="launch-time">10:11 BKK <span>·</span> 11:11 MNL</p>
      </div>
    </section>

    <aside class="soundtrack" aria-label="Teaser soundtrack">
      <div class="music-player">
        <div class="music-meta">
          <span class="music-kicker">♪ SOUNDTRACK</span>
          <span class="music-title" id="music-title">OomBam Playlist</span>
          <span class="music-status" id="music-status">Tap play to listen</span>
        </div>
        <div class="music-controls" aria-label="Music controls">
          <button class="music-btn" id="music-prev" type="button" aria-label="Previous song">‹</button>
          <button class="music-btn music-play" id="music-toggle" type="button" aria-label="Play soundtrack">▶</button>
          <button class="music-btn" id="music-next" type="button" aria-label="Next song">›</button>
        </div>
        <div class="music-progress" aria-hidden="true"><span id="music-progress-bar"></span></div>
        <div class="music-foot"><span id="music-track">01 / 03</span><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a></div>
        <div id="yt-player" class="yt-player" aria-hidden="true"></div>
      </div>
    </aside>

    <footer class="footer sequence sequence-footer">
      <span>DESIGNED WITH LOVE FOR OOMBAM</span><span>2026</span>
    </footer>

    <div class="vignette" aria-hidden="true"></div>
  </main>
  <script src="teaser.js?v=20260928-1111-4" defer></script>
</body>
</html>
